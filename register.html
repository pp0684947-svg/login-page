<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — LearnHub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="site.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html">LearnHub</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="signin.html">Sign In</a>
        <a href="register.html">Register</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>

    <main class="container auth-page">
      <section class="auth-card">
        <span class="eyebrow">Create your account</span>
        <h1>Start learning today</h1>
        <p class="auth-note">Register to unlock course progress, certificates, and your personalized profile.</p>

        <form class="auth-form register-form">
          <div class="auth-field">
            <label for="register-name">Full name</label>
            <input id="register-name" type="text" name="name" placeholder="Alex Johnson" required>
          </div>
          <div class="auth-field">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="auth-field">
            <label for="register-password">Password</label>
            <input id="register-password" type="password" name="password" placeholder="Create a password" required>
          </div>
          <button class="primary-button" type="submit">Register</button>
          <p class="form-footer">Already have an account? <a class="text-link" href="signin.html">Sign in</a></p>
          <p class="message" id="register-message"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 LearnHub — your learning journey starts here.</p>
    </footer>
  </div>
</body>
</html>
