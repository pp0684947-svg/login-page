<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate — LearnHub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="site.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html">LearnHub</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="signin.html">Sign In</a>
        <a href="register.html">Register</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>

    <main class="container certificate-page">
      <section class="certificate-card profile-card">
        <span class="eyebrow">Certificate</span>
        <h1>Completion certificate</h1>
        <p class="detail-copy">Download your verified certificate after completing the course.</p>

        <div class="certificate-details">
          <p><strong>Name:</strong> <span id="certificate-name">—</span></p>
          <p><strong>Course:</strong> <span id="certificate-course">—</span></p>
          <p><strong>Date:</strong> <span id="certificate-date">—</span></p>
        </div>

        <p class="certificate-status-text" id="certificate-status-text">Checking status…</p>
        <button class="primary-button" id="download-certificate-button" type="button">Download certificate</button>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 LearnHub — celebrate your achievement.</p>
    </footer>
  </div>
</body>
</html>
